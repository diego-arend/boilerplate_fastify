services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: boilerplate_app_dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.api.development
    depends_on:
      - mongodb
      - redis
    networks:
      - boilerplate_network
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm run dev
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 🆕 NOVO SERVIÇO: Worker Development
  worker-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env.worker.development
    depends_on:
      - mongodb
      - redis
    networks:
      - boilerplate_network
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm run worker:dev # 🆕 Comando específico para worker
    deploy:
      replicas: 1 # 🆕 1 replica por padrão
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "console.log('Worker dev health'); process.exit(0)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mongodb:
    image: mongo:latest
    container_name: boilerplate_mongodb_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: boilerplate
    volumes:
      - mongodb_data:/data/db
    networks:
      - boilerplate_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:latest
    container_name: boilerplate_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - boilerplate_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Services container for development
  # BullMq Dashboard
  bull-board:
    build:
      context: ./bullDashboard
      dockerfile: Dockerfile
    container_name: bull-dashboard
    ports:
      - "3002:3002"
    environment:
      - REDIS_HOST=redis # O nome do serviço Redis no Compose
    networks:
      - boilerplate_network
    depends_on:
      - redis

  # Fake email server smtp for send email and dashboard for visualize emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025" # Porta SMTP - a mesma que você usa no Nodemailer
      - "8025:8025" # Porta da Interface Web - acesse http://localhost:8025
    restart: unless-stopped
    networks:
      - boilerplate_network

  # MinIO S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: minio_dev
    restart: unless-stopped
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - boilerplate_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 🆕 NOVO SERVIÇO: Evolution API - WhatsApp Integration
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution_api_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Server Configuration
      - SERVER_URL=http://localhost:8080
      - DEL_INSTANCE=false

      # Database Configuration (PostgreSQL)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password@evolution_db:5432/evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_dev

      # Cache Configuration (Redis)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/2
      - CACHE_REDIS_PREFIX_KEY=evolution_dev
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false

      # S3/MinIO Configuration (Disabled for simplicity)
      - S3_ENABLED=false

      # Authentication
      - AUTHENTICATION_API_KEY=B6D711FCDE4D4FD5936544120E713976

      # RabbitMQ (Disabled for development)
      - RABBITMQ_ENABLED=false

      # Webhook Configuration
      - WEBHOOK_GLOBAL_URL=http://localhost:3001/api/whatsapp/webhook
      - WEBHOOK_GLOBAL_ENABLED=false

      # Other Configurations
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Development
      - QRCODE_LIMIT=5
      - PROVIDER_HOST=127.0.0.1
      - PROVIDER_PORT=5656
      - PROVIDER_PREFIX=evolution
    depends_on:
      - evolution_db
      - redis
    networks:
      - boilerplate_network
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 🆕 NOVO SERVIÇO: Evolution API Database
  evolution_db:
    image: postgres:16-alpine
    container_name: evolution_db_dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_password
      - POSTGRES_DB=evolution_api
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - boilerplate_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
  redis_data:
  mailhog_data:
  minio_data:
  evolution_instances:
  evolution_db_data:

networks:
  boilerplate_network:
    driver: bridge
